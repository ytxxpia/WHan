<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>文件索引</title>
</head>
<body style="background:white;">

    <h1>选择仓库文件夹</h1>
    <input type="file" id="folderInput" webkitdirectory multiple>
    <div id="root"></div>

    <script>
        document.getElementById('folderInput').addEventListener('change', function(e) {
            const files = e.target.files;
            const root = document.getElementById('root');
            root.innerHTML = '';

            if (files.length === 0) {
                root.textContent = '未选择文件夹';
                return;
            }

            // 获取选中的根文件夹名
            let rootFolderName = '';
            if (files.length > 0) {
                const firstPath = files[0].webkitRelativePath;
                rootFolderName = firstPath.split('/')[0];
            }

            // 只处理 sth/ 目录下的内容
            const sthFiles = [];
            for (const file of files) {
                const pathParts = file.webkitRelativePath.split('/');
                // 检查是否在 sth/ 目录下
                if (pathParts.length >= 2 && pathParts[0] === rootFolderName && pathParts[1] === 'sth') {
                    sthFiles.push({
                        file: file,
                        relativePath: pathParts.slice(2).join('/')
                    });
                }
            }

            if (sthFiles.length === 0) {
                root.textContent = '未找到 sth/ 文件夹';
                return;
            }

            // 构建树结构
            const tree = {};
            for (const item of sthFiles) {
                const path = item.relativePath.split('/');
                let current = tree;
                for (let i = 0; i < path.length; i++) {
                    const name = path[i];
                    if (i === path.length - 1) {
                        // 文件
                        if (!current._files) current._files = [];
                        current._files.push(item.file);
                    } else {
                        // 文件夹
                        if (!current[name]) current[name] = {};
                        current = current[name];
                    }
                }
            }

            // 渲染树
            function renderTree(node, container) {
                const ul = document.createElement('ul');
                const keys = Object.keys(node).filter(k => k !== '_files').sort();
                
                for (const key of keys) {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = '#';
                    a.textContent = key + '/';
                    a.onclick = (e) => {
                        e.preventDefault();
                        let subUl = li.querySelector('ul');
                        if (!subUl) {
                            subUl = document.createElement('ul');
                            li.appendChild(subUl);
                            renderTree(node[key], subUl);
                        } else {
                            subUl.style.display = subUl.style.display === 'none' ? 'block' : 'none';
                        }
                    };
                    li.appendChild(a);
                    ul.appendChild(li);
                }

                // 渲染文件（过滤 keep.md）
                if (node._files) {
                    const files = node._files.filter(f => f.name !== 'keep.md');
                    for (const file of files) {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(file);
                        a.textContent = file.name;
                        a.target = '_blank';
                        li.appendChild(a);
                        ul.appendChild(li);
                    }
                }

                container.appendChild(ul);
            }

            // 显示根目录标题
            const title = document.createElement('h2');
            title.textContent = 'sth/';
            root.appendChild(title);

            renderTree(tree, root);
        });
    </script>

</body>
</html>
